<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSM Deleted Objects Explorer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; overflow: hidden; }
    #map { flex: 1; height: 100%; z-index: 1; }
    #sidebar { width: 380px; height: 100%; background: #ffffff; border-left: 1px solid #e5e7eb; display: flex; flex-direction: column; z-index: 2; box-shadow: -2px 0 10px rgba(0,0,0,0.05); }
    .header { padding: 16px; background: #111827; color: white; }
    .header h1 { font-size: 1.1rem; margin-bottom: 10px; font-weight: 600; }
    button { width: 100%; background: #e11d48; color: white; border: none; padding: 10px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s, opacity 0.2s; }
    button:hover:not(:disabled) { background: #be123c; }
    button:disabled { background: #9ca3af; cursor: not-allowed; opacity: 0.6; }
    .status { padding: 12px 16px; font-size: 0.85rem; color: #4b5563; border-bottom: 1px solid #e5e7eb; background: #f9fafb; }
    .results-container { flex: 1; overflow-y: auto; padding: 12px; }
    .card { background: #f3f4f6; border-radius: 8px; padding: 12px; margin-bottom: 10px; border-left: 4px solid #e11d48; font-size: 0.85rem; cursor: pointer; transition: background 0.2s; }
    .card:hover { background: #e5e7eb; }
    .card-title { font-weight: 700; color: #111827; margin-bottom: 6px; word-break: break-all; }
    .card-meta { color: #4b5563; line-height: 1.4; font-size: 0.8rem; }
    .tag-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-family: monospace; font-size: 0.75rem; }
    .tag-table td { padding: 3px 6px; border: 1px solid #d1d5db; background: #ffffff; word-break: break-all; }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="sidebar">
    <div class="header">
      <h1>OSM Deleted Objects Finder</h1>
      <button id="fetch-btn" disabled>Get deleted objects around this area</button>
    </div>
    <div id="status" class="status">Zoom in to the maximum level to enable search.</div>
    <div id="results" class="results-container"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const MAX_ZOOM = 18;
    const map = L.map('map', { maxZoom: MAX_ZOOM }).setView([-6.2088, 106.8456], 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: MAX_ZOOM,
      attribution: '&copy; OpenStreetMap contributors | Overpass API'
    }).addTo(map);

    let deletedLayerGroup = L.layerGroup().addTo(map);

    const fetchBtn = document.getElementById('fetch-btn');
    const statusDiv = document.getElementById('status');
    const resultsDiv = document.getElementById('results');

    function updateButtonState() {
      const currentZoom = map.getZoom();
      if (currentZoom >= MAX_ZOOM) {
        fetchBtn.disabled = false;
        statusDiv.textContent = 'Maximum zoom level reached. Ready to search deleted objects.';
      } else {
        fetchBtn.disabled = true;
        statusDiv.textContent = `Zoom in closer to enable search (Current zoom: ${currentZoom}/${MAX_ZOOM}).`;
      }
    }

    map.on('zoomend', updateButtonState);
    updateButtonState();

    fetchBtn.addEventListener('click', async () => {
      if (map.getZoom() < MAX_ZOOM) return;

      const bounds = map.getBounds();
      const s = bounds.getSouth();
      const w = bounds.getWest();
      const n = bounds.getNorth();
      const e = bounds.getEast();
      
      statusDiv.textContent = 'Querying Overpass API for deleted objects...';
      fetchBtn.disabled = true;
      resultsDiv.innerHTML = '';
      deletedLayerGroup.clearLayers();

      const overpassQuery = `[timeout:999][adiff:"2014-01-01T00:00:00Z"];(node(${s},${w},${n},${e});way(${s},${w},${n},${e});relation(${s},${w},${n},${e}););out meta geom;`;

      try {
        const response = await fetch('https://overpass-api.de/api/interpreter', {
          method: 'POST',
          body: 'data=' + encodeURIComponent(overpassQuery)
        });

        if (!response.ok) throw new Error(`HTTP error status: ${response.status}`);
        const xmlText = await response.text();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, 'text/xml');

        const parseError = xmlDoc.querySelector('parsererror');
        if (parseError) throw new Error('Failed to parse XML response from Overpass API.');

        const deleteActions = xmlDoc.querySelectorAll('action[type="delete"]');

        if (deleteActions.length === 0) {
          statusDiv.textContent = 'No deleted objects found in the selected viewport since 2020.';
          updateButtonState();
          return;
        }

        statusDiv.textContent = `Found ${deleteActions.length} deleted object(s) in this area.`;

        deleteActions.forEach((action, idx) => {
          const oldEl = action.querySelector('old');
          if (!oldEl) return;

          const targetEl = oldEl.firstElementChild;
          if (!targetEl) return;

          const type = targetEl.tagName;
          const id = targetEl.getAttribute('id');
          const osmId = `${type}/${id}`;
          const user = targetEl.getAttribute('user') || 'Anonymous';
          const rawTime = targetEl.getAttribute('timestamp');
          const timestamp = rawTime ? new Date(rawTime).toLocaleString() : 'N/A';
          const changeset = targetEl.getAttribute('changeset') || 'N/A';

          const tags = {};
          targetEl.querySelectorAll('tag').forEach(tagEl => {
            tags[tagEl.getAttribute('k')] = tagEl.getAttribute('v');
          });

          let layer;
          if (type === 'node') {
            const lat = parseFloat(targetEl.getAttribute('lat'));
            const lon = parseFloat(targetEl.getAttribute('lon'));
            if (!isNaN(lat) && !isNaN(lon)) {
              layer = L.circleMarker([lat, lon], {
                radius: 7,
                fillColor: '#e11d48',
                color: '#ffffff',
                weight: 2,
                fillOpacity: 0.9
              });
            }
          } else if (type === 'way') {
            const latlngs = [];
            targetEl.querySelectorAll('nd').forEach(ndEl => {
              const lat = parseFloat(ndEl.getAttribute('lat'));
              const lon = parseFloat(ndEl.getAttribute('lon'));
              if (!isNaN(lat) && !isNaN(lon)) {
                latlngs.push([lat, lon]);
              }
            });
            if (latlngs.length > 0) {
              layer = L.polyline(latlngs, { color: '#e11d48', weight: 4, opacity: 0.9 });
            }
          }

          if (layer) {
            layer.bindPopup(`<strong>OSM ID:</strong> ${osmId}<br/><strong>u/</strong> ${user}<br/><strong>Date:</strong> ${timestamp}`);
            deletedLayerGroup.addLayer(layer);
          }

          const card = document.createElement('div');
          card.className = 'card';

          let tagsHtml = '';
          const tagEntries = Object.entries(tags);
          if (tagEntries.length > 0) {
            tagsHtml = `<table class="tag-table">` + 
              tagEntries.map(([k, v]) => `<tr><td><b>${k}</b></td><td>${v}</td></tr>`).join('') +
              `</table>`;
          }

          card.innerHTML = `
            <div class="card-title">${osmId}</div>
            <div class="card-meta">
              <strong>Deleted by:</strong> ${user}<br/>
              <strong>Date:</strong> ${timestamp}<br/>
              <strong>Changeset ID:</strong> ${changeset}
            </div>
            ${tagsHtml}
          `;

          card.addEventListener('click', () => {
            if (layer) {
              if (layer.getBounds) {
                map.fitBounds(layer.getBounds(), { maxZoom: MAX_ZOOM, padding: [20, 20] });
              } else if (layer.getLatLng) {
                map.setView(layer.getLatLng(), MAX_ZOOM);
              }
              layer.openPopup();
            }
          });

          resultsDiv.appendChild(card);
        });

      } catch (err) {
        console.error(err);
        statusDiv.textContent = 'Error fetching data from Overpass API. Ensure the bounding box is small.';
      } finally {
        updateButtonState();
      }
    });
  </script>
</body>
</html>
